[package]
name = "mandasisstant"
version = "0.1.0"
description = "English <-> Mandarin translator using on-device speech recognition (sherpa-onnx) and Apple Translation"
authors = ["Espen Hellerud"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mandasisstant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
swift-rs = { version = "=1.0.9", features = ["build"] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Keep identical to the SwiftRs package version in AppleBridge/Package.swift.
swift-rs = "=1.0.9"
# The default `static` feature downloads a prebuilt static library on the first build.
# It bundles onnxruntime, so don't add `ort` or `sherpa-rs`: their symbols would clash.
sherpa-onnx = "2.0.1"
cpal = "0.18.2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
